<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Neon Glow Filters -->
  <defs>
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base for Tab Contrast -->
  <rect width="512" height="512" rx="112" fill="#050508" />

  <!-- Antennas (Glowing Cyan) -->
  <path d="M190 140 L235 66" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" filter="url(#cyan-glow)" />
  <circle cx="235" cy="66" r="14" fill="#00f0ff" filter="url(#cyan-glow)" />
  
  <path d="M322 140 L277 66" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" filter="url(#cyan-glow)" />
  <circle cx="277" cy="66" r="14" fill="#00f0ff" filter="url(#cyan-glow)" />

  <!-- TV Outer Frame (Glowing Neon Pink) -->
  <rect x="64" y="130" width="384" height="310" rx="40" stroke="#ff007f" stroke-width="20" filter="url(#pink-glow)" fill="#0c0c12" />

  <!-- TV Inner Screen (Dark Synthwave Purple) -->
  <rect x="94" y="160" width="256" height="250" rx="24" fill="#12121c" stroke="#1f1f2e" stroke-width="4" />
  
  <!-- Retro Scanline Overlay -->
  <line x1="94" y1="200" x2="350" y2="200" stroke="rgba(255, 255, 255, 0.025)" stroke-width="2" />
  <line x1="94" y1="240" x2="350" y2="240" stroke="rgba(255, 255, 255, 0.025)" stroke-width="2" />
  <line x1="94" y1="280" x2="350" y2="280" stroke="rgba(255, 255, 255, 0.025)" stroke-width="2" />
  <line x1="94" y1="320" x2="350" y2="320" stroke="rgba(255, 255, 255, 0.025)" stroke-width="2" />
  <line x1="94" y1="360" x2="350" y2="360" stroke="rgba(255, 255, 255, 0.025)" stroke-width="2" />

  <!-- Central Play Action Button (Neon Cyan) -->
  <polygon points="194,235 194,335 280,285" fill="#00f0ff" filter="url(#cyan-glow)" />

  <!-- Control Dial Knobs (Pink Details) -->
  <circle cx="394" cy="204" r="20" fill="#161622" stroke="#ff007f" stroke-width="6" />
  <line x1="394" y1="204" x2="408" y2="190" stroke="#ff007f" stroke-width="6" stroke-linecap="round" />
  
  <circle cx="394" cy="274" r="20" fill="#161622" stroke="#ff007f" stroke-width="6" />
  <line x1="394" y1="274" x2="380" y2="288" stroke="#ff007f" stroke-width="6" stroke-linecap="round" />

  <!-- Speaker Vents Grid -->
  <rect x="376" y="336" width="36" height="8" rx="4" fill="#2d2d3e" />
  <rect x="376" y="354" width="36" height="8" rx="4" fill="#2d2d3e" />
  <rect x="376" y="372" width="36" height="8" rx="4" fill="#2d2d3e" />
  <rect x="376" y="390" width="36" height="8" rx="4" fill="#2d2d3e" />
</svg>