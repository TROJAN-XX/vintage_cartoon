<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vintage Cartoon placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d14" />
      <stop offset="1" stop-color="#16162a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ff007f" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff007f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)" />
  <rect width="400" height="600" fill="url(#glow)" />

  <!-- Film sprocket edges -->
  <g fill="#1f1f2e">
    <rect x="16" y="40" width="20" height="26" rx="4" />
    <rect x="16" y="90" width="20" height="26" rx="4" />
    <rect x="16" y="140" width="20" height="26" rx="4" />
    <rect x="16" y="190" width="20" height="26" rx="4" />
    <rect x="16" y="240" width="20" height="26" rx="4" />
    <rect x="16" y="290" width="20" height="26" rx="4" />
    <rect x="364" y="40" width="20" height="26" rx="4" />
    <rect x="364" y="90" width="20" height="26" rx="4" />
    <rect x="364" y="140" width="20" height="26" rx="4" />
    <rect x="364" y="190" width="20" height="26" rx="4" />
    <rect x="364" y="240" width="20" height="26" rx="4" />
    <rect x="364" y="290" width="20" height="26" rx="4" />
  </g>

  <!-- Neon TV outline -->
  <rect x="90" y="230" width="220" height="150" rx="20" fill="#0c0c12" stroke="#00f0ff" stroke-width="5" />
  <rect x="112" y="252" width="130" height="106" rx="10" fill="#12121c" stroke="#1f1f2e" stroke-width="3" />
  <!-- Play triangle -->
  <polygon points="150,278 150,332 196,305" fill="#00f0ff" />
  <!-- Antennas -->
  <line x1="150" y1="230" x2="120" y2="180" stroke="#ff007f" stroke-width="5" stroke-linecap="round" />
  <line x1="250" y1="230" x2="280" y2="180" stroke="#ff007f" stroke-width="5" stroke-linecap="round" />
  <circle cx="120" cy="180" r="7" fill="#ff007f" />
  <circle cx="280" cy="180" r="7" fill="#ff007f" />
  <!-- Dials -->
  <circle cx="272" cy="278" r="12" fill="#161622" stroke="#ff007f" stroke-width="3" />
  <circle cx="272" cy="316" r="12" fill="#161622" stroke="#ff007f" stroke-width="3" />

  <text x="200" y="440" text-anchor="middle" fill="#eaeaf2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">VINTAGE</text>
  <text x="200" y="474" text-anchor="middle" fill="#00f0ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">CARTOON</text>
</svg>
