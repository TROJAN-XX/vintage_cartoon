    <!-- P4-3: first-paint brand loader. Inline critical CSS so it paints
         instantly, before the JS/CSS bundles load. React removes it on mount
         (see the mount effect in src/App.jsx → .page-loader--hidden). -->
    <style>
      .page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        background: #07070a;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      .page-loader--hidden { opacity: 0; visibility: hidden; }
      .pl-stage { position: relative; width: 128px; height: 128px; }
      /* Rotating conic ring — pink → purple → cyan, masked to a thin circle */
      .pl-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #ff007f, #bd00ff, #00f0ff, #ff007f);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: pl-spin 1.1s linear infinite;
        filter: drop-shadow(0 0 10px rgba(255, 0, 128, 0.45));
      }
      .pl-tv {
        position: absolute;
        inset: 18px;
        animation: pl-float 2.6s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.35));
      }
      .pl-screen-glow { animation: pl-flicker 2.2s ease-in-out infinite; }
      .pl-wordmark {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: 0.28em;
        margin: 0;
        padding-left: 0.28em; /* optically re-center the tracked text */
        background: linear-gradient(90deg, #eaeaf2 30%, #00f0ff 50%, #eaeaf2 70%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: pl-shimmer 1.8s ease-in-out infinite;
      }
      .pl-tagline {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        color: #6b6b80;
        margin: 0;
        animation: pl-breathe 1.8s ease-in-out infinite;
      }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pl-flicker { 0%, 100% { opacity: 1; } 45% { opacity: 0.6; } 55% { opacity: 1; } }
      @keyframes pl-shimmer { 0% { background-position: 120% 0; } 100% { background-position: -80% 0; } }
      @keyframes pl-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .pl-ring, .pl-tv, .pl-screen-glow, .pl-wordmark, .pl-tagline { animation: none; }
      }
    </style>

    <!-- Flaw fix F23: structured data for search engines -->
    <script type="application/ld+json">
    {

  <body>
    <!-- P4-3: first-paint brand loader (neon TV + rotating ring). Hidden and
         removed by App.jsx once React has mounted. -->
    <div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-label="Loading Vintage Cartoon">
      <div class="pl-stage">
        <div class="pl-ring"></div>
        <svg class="pl-tv" viewBox="0 0 92 92" fill="none" aria-hidden="true">
          <!-- Antennas -->
          <path d="M32 34 L22 16" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
          <circle cx="22" cy="16" r="3.5" fill="#00f0ff" />
          <path d="M60 34 L70 16" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />

          <!-- TV body -->
          <rect x="10" y="34" width="72" height="48" rx="10" stroke="#ff007f" stroke-width="4" />
          <!-- Screen with glow (flickers like a warming CRT) -->
          <rect class="pl-screen-glow" x="18" y="42" width="40" height="32" rx="5" fill="#0c1a1e" stroke="#123" stroke-width="1" />
          <path class="pl-screen-glow" d="M33 50 L47 58 L33 66 Z" fill="#00f0ff" />
          <!-- Dials -->

          <circle cx="70" cy="66" r="4" stroke="#bd00ff" stroke-width="3" />
        </svg>
